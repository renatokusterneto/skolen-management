<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Feed Animado · Secretaria Sobrecarregada · TOFU · 1080×1080</title>
<link rel="stylesheet" href="file:///Users/renatokusterneto/Skolen/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow:     #FCD532;
  --teal:       #00EDBF;
  --pink:       #FF6DA0;
  --blue:       #009CDE;
  --text:       #253532;
  --white:      #FFFFFF;
  --gray-bg:    #F4F5F7;
  --gray-mid:   #8A95A3;
  --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; background: var(--white); }
body { font-family: 'Nunito', sans-serif; }

.circle { border-radius: 50%; position: absolute; }

.ad-logo-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.ad-logo-mark span { display: block; border-radius: 50%; }
.ad-logo-mark.sz40 { width: 80px; height: 80px; }
.ad-logo-mark.sz40 span { width: 35px; height: 35px; }
.lm-tl { background: var(--yellow); }
.lm-tr { background: var(--teal); }
.lm-bl { background: var(--pink); }
.lm-br { background: var(--blue); }
.ad-logo-text { font-size: 64px; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }

#canvas {
  width: 1080px;
  height: 1080px;
  background: var(--white);
  position: relative;
  overflow: hidden;
}

/* Círculos decorativos */
#canvas .c-tl {
  width: 340px; height: 340px;
  background: var(--teal);
  top: -110px; left: -110px;
}
#canvas .c-tr {
  width: 200px; height: 200px;
  background: var(--yellow);
  top: -55px; right: -55px;
}
#canvas .c-bl {
  width: 170px; height: 170px;
  background: var(--yellow);
  bottom: -45px; left: -45px;
}
#canvas .c-br {
  width: 300px; height: 300px;
  background: var(--pink);
  bottom: -85px; right: -85px;
}
#canvas .c-mid {
  width: 110px; height: 110px;
  background: var(--blue);
  top: 290px; right: 90px;
  opacity: 0.5;
}

#body {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 100px 110px;
  text-align: center;
  z-index: 2;
}

.eyebrow {
  font-size: 22px;
  font-weight: 800;
  color: var(--teal);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 32px;
  filter: brightness(0.75);
}

.headline {
  font-size: 84px;
  font-weight: 900;
  color: var(--text);
  line-height: 1.0;
  margin-bottom: 40px;
  letter-spacing: -2px;
}
.headline em { font-style: normal; color: var(--pink); }

.subhead {
  font-size: 38px;
  font-weight: 700;
  color: var(--text);
  opacity: 0.65;
  line-height: 1.35;
}
.subhead strong { color: var(--blue); font-weight: 900; opacity: 1; }

#logo {
  position: absolute;
  bottom: 56px;
  left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 3;
}

/* ── Animações ── */

/* Círculos: pop elástico */
@keyframes circle-pop {
  0%   { transform: scale(0); opacity: 0; }
  60%  { transform: scale(1.08); opacity: 1; }
  80%  { transform: scale(0.96); }
  100% { transform: scale(1); }
}

/* Texto: sobe com fade */
@keyframes text-rise {
  0%   { transform: translateY(28px); opacity: 0; }
  100% { transform: translateY(0);    opacity: 1; }
}

/* Logo: fade simples */
@keyframes fade-in {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}

/* Círculos — cada um parte do seu próprio centro (transform-origin do canto) */
.c-tl {
  transform-origin: top left;
  animation: circle-pop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.0s both;
}
.c-tr {
  transform-origin: top right;
  animation: circle-pop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
}
.c-bl {
  transform-origin: bottom left;
  animation: circle-pop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
}
.c-br {
  transform-origin: bottom right;
  animation: circle-pop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
}
.c-mid {
  transform-origin: center;
  animation: circle-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both;
}

/* Texto — cascata após os círculos */
.eyebrow {
  animation: text-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
}
.headline {
  animation: text-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.72s both;
}
.subhead {
  animation: text-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.90s both;
}
#logo {
  animation: fade-in 0.5s ease 1.1s both;
}
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div class="circle c-mid"></div>

  <div id="body">
    <p class="eyebrow">Diretores de Escola</p>
    <h1 class="headline">
      Sua secretária apaga<br>incêndio <em>o dia todo?</em>
    </h1>
    <p class="subhead">
      Matrícula, boleto e recado de pai<br>
      <strong>dá pra ser automático.</strong>
    </p>
  </div>

  <div id="logo">
    <div class="ad-logo-mark sz40">
      <span class="lm-tl"></span>
      <span class="lm-tr"></span>
      <span class="lm-bl"></span>
      <span class="lm-br"></span>
    </div>
    <span class="ad-logo-text">Skolen</span>
  </div>
</div>
</body>
</html>
