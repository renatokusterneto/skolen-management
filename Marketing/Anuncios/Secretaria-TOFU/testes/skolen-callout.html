<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="file:///Users/renatokusterneto/Skolen/.claude/skills/carrousel/fonts/nunito.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Nunito', sans-serif; }

.ad {
  position: relative;
  width: 1080px; height: 1080px;
  overflow: hidden;
  background: #f5f5f3;
}

/* Foto de fundo */
.bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center center;
}

/* Overlay diagonal claro — libera área inf-dir para a foto */
.overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.94) 0%,
    rgba(255,255,255,0.75) 28%,
    rgba(255,255,255,0.30) 55%,
    rgba(255,255,255,0.00) 75%
  );
}

/* Logo — topo esquerdo */
.logo {
  position: absolute;
  top: 52px; left: 56px;
  z-index: 10;
  display: flex; align-items: center; gap: 14px;
}
.logo-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 56px; height: 56px; }
.logo-mark span { display: block; border-radius: 50%; width: 23px; height: 23px; }
.logo-mark span:nth-child(1) { background: #FCD532; }
.logo-mark span:nth-child(2) { background: #00EDBF; }
.logo-mark span:nth-child(3) { background: #FF6DA0; }
.logo-mark span:nth-child(4) { background: #009CDE; }
.logo-text { font-size: 44px; font-weight: 900; color: #253532; letter-spacing: -0.5px; }

/* Headline — topo esquerdo abaixo da logo */
.headline {
  position: absolute;
  top: 155px; left: 56px;
  width: 480px;
  z-index: 10;
  font-size: 82px;
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -0.03em;
  color: #253532;
}
.headline em { font-style: normal; color: #FF6DA0; }

/* Callout pill — canto esquerdo, ~60% do height */
.callout {
  position: absolute;
  top: 700px; left: 0;
  right: 440px;
  z-index: 10;
  background: #FF6DA0;
  border-radius: 0 100px 100px 0;
  padding: 28px 48px 28px 56px;
  color: #fff;
  font-size: 32px;
  font-weight: 800;
  line-height: 1.35;
}

/* Setas — rodapé esquerdo */
.arrows {
  position: absolute;
  left: 56px; bottom: 64px;
  display: flex; gap: 8px;
  z-index: 10;
}
.arrow { width: 72px; height: 72px; flex-shrink: 0; }
.arrow svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="ad">

  <img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/pessoas/notebook_pessoa_sistema.png" alt="" class="bg">
  <div class="overlay"></div>

  <div class="logo">
    <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
    <span class="logo-text">Skolen</span>
  </div>

  <div class="headline">
    Pare de pagar<br>salário pra<br><em>fazer manual</em><br>o que é<br>automático.
  </div>

  <div class="callout">
    Skolen: matrícula, boleto e<br>comunicado sem retrabalho.
  </div>

  <div class="arrows">
    <svg class="arrow" viewBox="0 0 56 56" fill="none">
      <path d="M10 12 L44 28 L10 44" stroke="#FCD532" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="arrow" viewBox="0 0 56 56" fill="none">
      <path d="M10 12 L44 28 L10 44" stroke="#FCD532" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

</div>
</body>
</html>
