<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="file:///Users/renatokusterneto/Skolen/.claude/skills/carrousel/fonts/nunito.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Nunito', sans-serif; }

.ad {
  position: relative;
  width: 1080px; height: 1080px;
  overflow: hidden;
  background: #111;
}

.bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center center;
}

/* Overlay diagonal escuro — área sup-esq para o texto */
.top-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(
    148deg,
    rgba(37,53,50,0.72) 0%,
    rgba(37,53,50,0.48) 38%,
    rgba(37,53,50,0.12) 62%,
    rgba(37,53,50,0.00) 80%
  );
}

/* Logo — rodapé esquerdo */
.logo {
  position: absolute;
  bottom: 56px; left: 80px;
  z-index: 30;
  display: flex; align-items: center; gap: 14px;
}
.logo-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 56px; height: 56px; }
.logo-mark span { display: block; border-radius: 50%; width: 23px; height: 23px; }
.logo-mark span:nth-child(1) { background: #FCD532; }
.logo-mark span:nth-child(2) { background: #00EDBF; }
.logo-mark span:nth-child(3) { background: #FF6DA0; }
.logo-mark span:nth-child(4) { background: #009CDE; }
.logo-text { font-size: 44px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }

/* Header box — topo, largura parcial */
.header-box {
  position: absolute;
  top: 52px; left: 80px; right: 56px;
  z-index: 20;
  background: #FF6DA0;
  border-radius: 16px;
  color: #fff;
  text-align: center;
  padding: 18px 32px;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.3;
  width: fit-content;
}

/* Headline com text-shadow 3D usando cores Skolen */
.headline {
  position: absolute;
  top: 150px; left: 80px;
  z-index: 20;
}

.headline .transformar {
  font-size: 128px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.04em;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    1px 1px 0 #FCD532,
    2px 2px 0 #FCD532,
    3px 3px 0 #e6b800,
    4px 4px 0 #c09800,
    5px 5px 0 #8a6c00,
    6px 6px 0 #4a3800;
}

.headline .tag-screen {
  display: block;
  margin-top: 16px;
  font-size: 72px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.03em;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    1px 1px 0 #FCD532,
    2px 2px 0 #FCD532,
    3px 3px 0 #e6b800,
    4px 4px 0 #c09800,
    5px 5px 0 #8a6c00,
    6px 6px 0 #4a3800;
}

.headline .tag-learning {
  display: block;
  margin-top: 12px;
  font-size: 48px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    1px 1px 0 #FCD532,
    2px 2px 0 #FCD532,
    3px 3px 0 #e6b800,
    4px 4px 0 #c09800,
    5px 5px 0 #8a6c00,
    6px 6px 0 #4a3800;
}

/* Setas — rodapé direito */
.arrows {
  position: absolute;
  right: 56px; bottom: 64px;
  display: flex; gap: 8px;
  z-index: 30;
}
.arrow { width: 72px; height: 72px; flex-shrink: 0; }
.arrow svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="ad">

  <img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/pessoas/notebook_pessoa_sistema.png" alt="" class="bg">
  <div class="top-overlay"></div>

  <div class="header-box">Seu sistema tem app para os pais?</div>

  <div class="headline">
    <div class="transformar">SE NÃO</div>
    <div class="tag-screen">TEM, VOCÊ</div>
    <div class="tag-learning">PERDE ALUNOS.</div>
  </div>

  <div class="logo">
    <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
    <span class="logo-text">Skolen</span>
  </div>

  <div class="arrows">
    <svg class="arrow" viewBox="0 0 56 56" fill="none">
      <path d="M10 12 L44 28 L10 44" stroke="#FCD532" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="arrow" viewBox="0 0 56 56" fill="none">
      <path d="M10 12 L44 28 L10 44" stroke="#FCD532" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

</div>
</body>
</html>
