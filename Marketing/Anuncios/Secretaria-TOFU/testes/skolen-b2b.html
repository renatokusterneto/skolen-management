<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="file:///Users/renatokusterneto/Skolen/.claude/skills/carrousel/fonts/nunito.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Nunito', sans-serif; }

.post {
  position: relative;
  width: 1080px; height: 1080px;
  overflow: hidden;
  background: #f0f0f0;
}

.bg-photo {
  position: absolute; inset: 0;
}
.bg-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

/* Escurece levemente o topo para contrastar com o card */
.bg-photo::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 60%);
}

/* Card glassmorphism no rodapé */
.card {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 52px 64px 60px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Linha de cor de topo do card */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 5px;
  background: linear-gradient(90deg, #FCD532 0%, #00EDBF 33%, #FF6DA0 66%, #009CDE 100%);
}

.title {
  font-size: 72px;
  font-weight: 900;
  color: #253532;
  line-height: 1.0;
  letter-spacing: -0.03em;
}
.title em { font-style: normal; color: #FF6DA0; }

.support {
  font-size: 34px;
  font-weight: 600;
  color: #253532;
  opacity: 0.65;
  line-height: 1.4;
}

.cta-btn {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  padding: 20px 44px;
  border-radius: 100px;
  font-size: 28px;
  font-weight: 800;
  color: #253532;
  background: #FF6DA0;
  white-space: nowrap;
}

/* Logo — topo esquerdo */
.logo {
  position: absolute;
  top: 40px; left: 48px;
  z-index: 30;
  display: flex; align-items: center; gap: 14px;
}
.logo-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 56px; height: 56px; }
.logo-mark span { display: block; border-radius: 50%; width: 23px; height: 23px; }
.logo-mark span:nth-child(1) { background: #FCD532; }
.logo-mark span:nth-child(2) { background: #00EDBF; }
.logo-mark span:nth-child(3) { background: #FF6DA0; }
.logo-mark span:nth-child(4) { background: #009CDE; }
.logo-text { font-size: 44px; font-weight: 900; color: #fff; letter-spacing: -0.5px;
  filter: drop-shadow(0 1px 6px rgba(0,0,0,0.4)); }
</style>
</head>
<body>
<div class="post">

  <div class="bg-photo">
    <img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/pessoas/notebook_pessoa_sistema.png" alt="">
  </div>

  <div class="logo">
    <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
    <span class="logo-text">Skolen</span>
  </div>

  <div class="card">
    <div class="title">"A secretária quis usar <em>desde o 1º dia."</em></div>
    <div class="support">O que ouvimos toda semana de quem migrou para o Skolen. Sem treinamento longo. Sem caos. Em 7 dias.</div>
    <span class="cta-btn">Agende uma demo gratuita →</span>
  </div>

</div>
</body>
</html>
