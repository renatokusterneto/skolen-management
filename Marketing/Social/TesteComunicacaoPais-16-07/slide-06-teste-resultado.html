<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Teste Resultado</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:200px; height:200px; background:var(--yellow); top:-58px; left:-58px; }
#canvas .c-tr { width:240px; height:240px; background:var(--pink); top:-70px; right:-70px; }
#canvas .c-bl { width:200px; height:200px; background:var(--blue); bottom:-58px; left:-58px; }
#canvas .c-br { width:220px; height:220px; background:var(--pink); bottom:-65px; right:-65px; }
#body {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:90px 100px 130px; text-align:center; z-index:2; gap:0;
}
.label { font-size:20px; font-weight:800; color:var(--gray-mid); letter-spacing:2.5px; text-transform:uppercase; margin-bottom:28px; }
.criterio { font-size:32px; font-weight:800; color:var(--pink); margin-bottom:36px; }
.headline { font-size:52px; font-weight:900; color:var(--text); line-height:1.25; letter-spacing:-1px; margin-bottom:56px; }
.headline em { font-style:normal; color:var(--pink); }
.risk-track { width:100%; max-width:640px; height:28px; background:var(--gray-bg); border-radius:999px; overflow:hidden; position:relative; margin-bottom:20px; }
.risk-fill { height:100%; width:75%; background:var(--pink); border-radius:999px; }
.risk-caption { font-size:20px; font-weight:700; color:var(--gray-mid); }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <p class="label">Resultado do teste</p>
    <p class="criterio">2 ou mais respostas 'Sim'</p>
    <h2 class="headline"><span style="display:block">Os pais estão mais</span><span style="display:block">distantes do que <em>parece.</em></span></h2>
    <div class="risk-track"><div class="risk-fill"></div></div>
    <p class="risk-caption">3 de 4 sinais de risco identificados</p>
  </div>
</div>
</body>
</html>
