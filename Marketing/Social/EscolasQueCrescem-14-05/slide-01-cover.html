<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Slide Cover</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:320px; height:320px; background:var(--pink); top:-100px; left:-100px; }
#canvas .c-tr { width:220px; height:220px; background:var(--yellow); top:-65px; right:-65px; }
#canvas .c-bl { width:160px; height:160px; background:var(--blue); bottom:-45px; left:-45px; }
#canvas .c-br { width:240px; height:240px; background:var(--pink); bottom:-70px; right:-70px; }
#body {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:100px 110px 160px; text-align:center; z-index:2; gap:0;
}
.eyebrow { font-size:22px; font-weight:800; color:var(--pink); letter-spacing:2px; text-transform:uppercase; margin-bottom:36px; }
.headline { font-size:84px; font-weight:900; color:var(--text); line-height:1.0; letter-spacing:-2px; margin-bottom:36px; }
.headline em { font-style:normal; color:var(--pink); }
.subhead { font-size:34px; font-weight:700; color:var(--text); opacity:0.65; line-height:1.35; margin-bottom:64px; }
.swipe-hint { display:flex; align-items:center; gap:12px; font-size:22px; font-weight:800; color:var(--pink); letter-spacing:0.5px; }
.swipe-hint .arrow { display:flex; align-items:center; justify-content:center; width:44px; height:44px; background:var(--pink); border-radius:50%; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <p class="eyebrow">Gestão Escolar</p>
    <h1 class="headline">Mesma cidade. Mesmo esforço.<br>Uma cresce. A outra <em>não.</em></h1>
    <p class="subhead">O que separa escolas que crescem<br>das que estacionam não é talento.</p>
    <div class="swipe-hint">
      <span>deslize para ver</span>
      <div class="arrow">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
