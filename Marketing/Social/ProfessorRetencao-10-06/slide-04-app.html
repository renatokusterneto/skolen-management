<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Slide Gráfico de Barras</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:180px; height:180px; background:var(--pink); top:-52px; left:-52px; }
#canvas .c-tr { width:220px; height:220px; background:var(--blue); top:-65px; right:-65px; }
#canvas .c-bl { width:220px; height:220px; background:var(--yellow); bottom:-65px; left:-65px; }
#canvas .c-br { width:240px; height:240px; background:var(--teal); bottom:-70px; right:-70px; }
#body {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:80px 90px 120px; z-index:2; gap:0; text-align:center;
}
.label { font-size:18px; font-weight:800; color:#8A95A3; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:24px; }
.headline { font-size:60px; font-weight:900; color:var(--text); line-height:1.05; letter-spacing:-1.5px; margin-bottom:56px; }
.headline em { font-style:normal; color:var(--teal); }
.chart { display:flex; align-items:flex-end; justify-content:center; gap:24px; width:100%; height:320px; }
.bar-col { display:flex; flex-direction:column; align-items:center; gap:10px; flex:1; max-width:110px; height:100%; }
.bar-value { font-size:24px; font-weight:900; color:var(--teal); min-height:32px; }
.bar-wrap { flex:1; width:100%; display:flex; align-items:flex-end; }
.bar-fill { width:100%; border-radius:10px 10px 0 0; min-height:8px; transition:height 0.3s; }
.bar-label { font-size:18px; font-weight:700; color:#8A95A3; text-align:center; line-height:1.2; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <p class="label">Motivo real do cancelamento</p>
    <h2 class="headline">Vínculo com professor<br><em>define a retenção</em></h2>
    <div class="chart">
        <div class="bar-col">
          <div class="bar-value" style="color:var(--gray-mid)">18%</div>
          <div class="bar-wrap"><div class="bar-fill" style="height:37%;background:var(--gray-light)"></div></div>
          <div class="bar-label">Preço</div>
        </div>        <div class="bar-col">
          <div class="bar-value" style="color:var(--gray-mid)">12%</div>
          <div class="bar-wrap"><div class="bar-fill" style="height:24%;background:var(--gray-light)"></div></div>
          <div class="bar-label">Distância</div>
        </div>        <div class="bar-col">
          <div class="bar-value" style="color:var(--gray-mid)">21%</div>
          <div class="bar-wrap"><div class="bar-fill" style="height:43%;background:var(--gray-light)"></div></div>
          <div class="bar-label">Tempo</div>
        </div>        <div class="bar-col">
          <div class="bar-value" style="color:var(--teal)">49%</div>
          <div class="bar-wrap"><div class="bar-fill" style="height:100%;background:var(--teal)"></div></div>
          <div class="bar-label">Professor</div>
        </div>
    </div>
  </div>
</div>
</body>
</html>
