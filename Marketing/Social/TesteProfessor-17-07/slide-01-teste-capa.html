<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Teste Capa</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:320px; height:320px; background:var(--blue); top:-100px; left:-100px; }
#canvas .c-tr { width:220px; height:220px; background:var(--yellow); top:-65px; right:-65px; }
#canvas .c-bl { width:160px; height:160px; background:var(--blue); bottom:-45px; left:-45px; }
#canvas .c-br { width:240px; height:240px; background:var(--blue); bottom:-70px; right:-70px; }
.img-frame { width: 380px; height: 460px; border-radius: 28px; overflow: hidden; flex-shrink: 0;
  box-shadow: 0 24px 64px rgba(43,54,65,0.20); }
#body {
  position:absolute; inset:0; display:flex; align-items:center;
  gap:56px; padding:90px 90px 140px; text-align:left; z-index:2;
}
.text-side { flex:1; display:flex; flex-direction:column; justify-content:center; }
.badge { font-size:20px; font-weight:800; color:var(--blue); letter-spacing:2.5px; text-transform:uppercase;
  background:rgba(90,142,212,0.12); padding:12px 28px; border-radius:999px; margin-bottom:32px; align-self:flex-start; }
.headline { font-size:56px; font-weight:900; color:var(--text); line-height:1.1; letter-spacing:-1.5px; margin-bottom:28px; }
.headline em { font-style:normal; color:var(--blue); }
.subhead { font-size:28px; font-weight:700; color:var(--text); opacity:0.65; line-height:1.35; margin-bottom:48px; }
.swipe-hint { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:800; color:var(--blue); letter-spacing:0.5px; }
.swipe-hint .arrow { display:flex; align-items:center; justify-content:center; width:40px; height:40px; background:var(--blue); border-radius:50%; flex-shrink:0; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <div class="img-frame"><img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/gerado-ia/professor-retencao-capa.png" style="width:100%;height:100%;object-fit:cover;" alt=""></div>
    <div class="text-side">
      <p class="badge">Teste Rápido</p>
      <h1 class="headline"><span style="display:block">O professor esta</span><span style="display:block">de <em>saida?</em></span></h1>
      <p class="subhead">Responda 4 perguntas rapidas e descubra o risco.</p>
      <div class="swipe-hint">
        <span>responda deslizando</span>
        <div class="arrow">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
