<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Teste Pergunta</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:220px; height:220px; background:var(--blue); top:-65px; left:-65px; }
#canvas .c-tr { width:200px; height:200px; background:var(--yellow); top:-58px; right:-58px; }
#canvas .c-bl { width:240px; height:240px; background:var(--pink); bottom:-70px; left:-70px; }
#canvas .c-br { width:200px; height:200px; background:var(--blue); bottom:-58px; right:-58px; }
#body {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:90px 110px 140px; text-align:center; z-index:2; gap:0;
}
.progress { font-size:20px; font-weight:900; color:var(--gray-mid); letter-spacing:2px; margin-bottom:44px; }
.progress em { font-style:normal; color:var(--blue); }
.headline { font-size:58px; font-weight:900; color:var(--text); line-height:1.2; letter-spacing:-1.5px; margin-bottom:72px; }
.pills { display:flex; gap:28px; }
.pill { font-size:30px; font-weight:900; padding:24px 72px; border-radius:999px; }
.pill-sim { background:var(--blue); color:var(--white); }
.pill-nao { background:var(--gray-bg); color:var(--text); border:2px solid var(--gray-light); }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <p class="progress">Pergunta <em>4</em>/4</p>
    <h2 class="headline"><span style="display:block">Cancelamentos aumentaram logo</span><span style="display:block">apos uma troca de docente?</span></h2>
    <div class="pills">
      <div class="pill pill-sim">Sim</div>
      <div class="pill pill-nao">Não</div>
    </div>
  </div>
</div>
</body>
</html>
