<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Slide Foto Card</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:220px; height:220px; background:var(--yellow); top:-65px; left:-65px; }
#canvas .c-tr { width:200px; height:200px; background:var(--blue); top:-58px; right:-58px; }
#canvas .c-bl { width:240px; height:240px; background:var(--blue); bottom:-70px; left:-70px; }
#canvas .c-br { width:200px; height:200px; background:var(--blue); bottom:-58px; right:-58px; }
.img-frame {
  width: 400px; height: 440px; flex-shrink: 0; overflow: visible;
  display: flex; align-items: center; justify-content: center;
}
#body {
  position:absolute; inset:0; display:flex; align-items:center;
  flex-direction: row-reverse;
  gap: 48px; padding: 72px 72px 120px; z-index:2;
}
.text-side {
  flex:1; display:flex; flex-direction:column; justify-content:center;
  text-align:left;
}
.label { font-size:16px; font-weight:800; color:var(--blue); letter-spacing:2.5px;
  text-transform:uppercase; margin-bottom:20px; background:rgba(90,142,212,0.12);
  padding:8px 20px; border-radius:999px; align-self:flex-start; }
.headline { font-size:52px; font-weight:900; color:var(--text); line-height:1.05;
  letter-spacing:-1px; margin-bottom:24px; }
.headline em { font-style:normal; color:var(--blue); }
.body-text { font-size:28px; font-weight:700; color:var(--text); opacity:0.65;
  line-height:1.5; }
.body-text strong { color:var(--text); opacity:1; font-weight:900; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <div class="img-frame"><img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/pessoas/notebook_pessoa_sistema.png" style="width:100%;height:100%;object-fit:cover;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(43,54,65,0.18));" alt=""></div>
    <div class="text-side">
      <p class="label">O diagnóstico</p>
      <h2 class="headline">Dados estavam lá.<br>Ninguém <em>lia junto.</em></h2>
      <p class="body-text">Cada setor via uma parte.<br>A direção não via o todo.</p>
    </div>
  </div>
</div>
</body>
</html>
