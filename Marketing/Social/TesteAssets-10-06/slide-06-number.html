<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Slide Afirmação</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:200px; height:200px; background:var(--yellow); top:-58px; left:-58px; }
#canvas .c-tr { width:240px; height:240px; background:var(--blue); top:-70px; right:-70px; }
#canvas .c-bl { width:200px; height:200px; background:var(--blue); bottom:-58px; left:-58px; }
#canvas .c-br { width:220px; height:220px; background:var(--blue); bottom:-65px; right:-65px; }
#body {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:80px 100px 120px; text-align:center; z-index:2; gap:0;
}
.label { font-size:18px; font-weight:800; color:var(--blue); letter-spacing:2.5px; text-transform:uppercase; margin-bottom:48px; background:rgba(90,142,212,0.12); padding:10px 24px; border-radius:999px; }
.headline { font-size:76px; font-weight:900; color:var(--text); line-height:1.0; letter-spacing:-2px; margin-bottom:0; }
.headline em { font-style:normal; color:var(--blue); }
.accent-bar { width:100px; height:6px; background:var(--blue); border-radius:3px; margin:52px auto 0; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <p class="label">A moral</p>
    <h2 class="headline"><span style="display:block">A escola que enxerga</span><span style="display:block"><em>retém mais.</em></span></h2>
    <div class="accent-bar"></div>
  </div>
</div>
</body>
</html>
