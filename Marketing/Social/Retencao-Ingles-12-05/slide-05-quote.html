<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Carrossel Slide 5 · Quote · 1080×1080</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7; --gray-mid: #8A95A3;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; background: #FFFFFF; }
body { font-family: 'Nunito', sans-serif; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width: 220px; height: 220px; background: var(--blue);   top: -65px; left: -65px; }
#canvas .c-tr { width: 200px; height: 200px; background: var(--yellow); top: -58px; right: -58px; }
#canvas .c-bl { width: 240px; height: 240px; background: var(--pink);   bottom: -70px; left: -70px; }
#canvas .c-br { width: 200px; height: 200px; background: var(--blue);   bottom: -58px; right: -58px; }
#body {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 100px 130px;
  text-align: center; z-index: 2; gap: 0;
}
.quote-mark {
  font-size: 180px; font-weight: 900; color: var(--teal);
  line-height: 0.7; margin-bottom: 32px; opacity: 0.25;
}
.quote-card {
  max-width: 880px; width: 100%;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.quote-text {
  font-size: 48px; font-weight: 800; color: var(--text);
  line-height: 1.25; margin-bottom: 40px; letter-spacing: -0.5px;
}
.quote-text em { font-style: normal; color: var(--teal); }
.divider {
  width: 60px; height: 4px; background: var(--teal);
  border-radius: 3px; margin: 0 auto 28px;
}
.quote-author {
  font-size: 24px; font-weight: 700; color: var(--gray-mid);
}
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <div class="quote-mark">"</div>
    <div class="quote-card">
      <p class="quote-text">
        "Quando passei a acompanhar retenção,<br>parei de depender só de <em>captação.</em>"
      </p>
      <div class="divider"></div>
      <p class="quote-author">Diretora de escola de inglês · São Paulo</p>
    </div>
  </div>
</div>
</body>
