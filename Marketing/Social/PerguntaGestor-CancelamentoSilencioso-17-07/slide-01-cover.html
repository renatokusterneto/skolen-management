<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Slide Cover DM</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:320px; height:320px; background:var(--teal); top:-100px; left:-100px; }
#canvas .c-tr { width:220px; height:220px; background:var(--yellow); top:-65px; right:-65px; }
#canvas .c-bl { width:160px; height:160px; background:var(--blue); bottom:-45px; left:-45px; }
#canvas .c-br { width:240px; height:240px; background:var(--teal); bottom:-70px; right:-70px; }
#body {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:100px 90px 140px; text-align:center; z-index:2; gap:0;
}
.dm-sticker {
  width:100%; max-width:620px; border-radius:24px; overflow:hidden;
  box-shadow:0 20px 50px rgba(43,54,65,0.16);
  margin-bottom:64px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.dm-prompt {
  background:#3A3A3A; padding:24px 32px; font-size:22px; font-weight:600;
  color:#FFFFFF; line-height:1.35;
}
.dm-answer {
  background:#FFFFFF; padding:36px 32px;
}
.dm-headline { font-size:36px; font-weight:700; color:#1A1A1A; line-height:1.25; letter-spacing:-0.3px; }
.dm-headline em { font-style:normal; color:var(--teal); }
.swipe-hint { display:flex; align-items:center; gap:12px; font-size:22px; font-weight:800; color:var(--teal); letter-spacing:0.5px; }
.swipe-hint .arrow { display:flex; align-items:center; justify-content:center; width:44px; height:44px; background:var(--teal); border-radius:50%; }
#bg-photo { position:absolute; inset:0; z-index:0; }
#bg-photo img { width:100%; height:100%; object-fit:cover; object-position:center top; }
#bg-overlay { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.45) 100%); }
.swipe-hint { color:#FFFFFF !important; }
.swipe-hint .arrow { background:#FFFFFF !important; }
.swipe-hint .arrow path { stroke:#1A1A1A !important; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="bg-photo"><img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/gerado-ia/app_risco_cancelamento_contexto_v2.png" alt=""></div>
  <div id="bg-overlay"></div>
  <div id="body">
    <div class="dm-sticker">
      <div class="dm-prompt">Pergunte algo sobre sua escola</div>
      <div class="dm-answer">
        <h1 class="dm-headline"><span style="display:block">Como sei que um aluno</span><span style="display:block">vai <em>cancelar</em> antes dele avisar?</span></h1>
      </div>
    </div>
    <div class="swipe-hint">
      <span>deslize para ver</span>
      <div class="arrow">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
