<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skolen — Slide Foto Card</title>
<link rel="stylesheet" href="file:///c:/Users/felipe.fadel/skolen-management/.claude/skills/carrousel/fonts/nunito.css">
<style>
:root {
  --yellow: #F5C842; --teal: #5ECBA8; --pink: #E87DB0; --blue: #5A8ED4;
  --text: #2B3641; --white: #FFFFFF; --gray-bg: #F4F5F7;
  --gray-mid: #8A95A3; --gray-light: #E8EAED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: #FFFFFF; }
.circle { border-radius: 50%; position: absolute; }
#canvas { width: 1080px; height: 1080px; background: var(--white); position: relative; overflow: hidden; }
#canvas .c-tl { width:180px; height:180px; background:var(--pink); top:-52px; left:-52px; }
#canvas .c-tr { width:220px; height:220px; background:var(--blue); top:-65px; right:-65px; }
#canvas .c-bl { width:220px; height:220px; background:var(--yellow); bottom:-65px; left:-65px; }
#canvas .c-br { width:240px; height:240px; background:var(--pink); bottom:-70px; right:-70px; }
.img-frame {
  width: 340px; height: 340px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  border: 8px solid var(--pink); box-shadow: 0 20px 60px rgba(43,54,65,0.18);
}
#body {
  position:absolute; inset:0; display:flex; align-items:center;
  flex-direction: row-reverse;
  gap: 48px; padding: 72px 72px 120px; z-index:2;
}
.text-side {
  flex:1; display:flex; flex-direction:column; justify-content:center;
  text-align:left;
}
.label { font-size:16px; font-weight:800; color:var(--pink); letter-spacing:2.5px;
  text-transform:uppercase; margin-bottom:20px; background:rgba(232,125,176,0.12);
  padding:8px 20px; border-radius:999px; align-self:flex-start; }
.headline { font-size:52px; font-weight:900; color:var(--text); line-height:1.05;
  letter-spacing:-1px; margin-bottom:24px; }
.headline em { font-style:normal; color:var(--pink); }
.body-text { font-size:28px; font-weight:700; color:var(--text); opacity:0.65;
  line-height:1.5; }
.body-text strong { color:var(--text); opacity:1; font-weight:900; }
</style>
</head>
<body>
<div id="canvas">
  <div class="circle c-tl"></div>
  <div class="circle c-tr"></div>
  <div class="circle c-bl"></div>
  <div class="circle c-br"></div>
  <div id="body">
    <div class="img-frame"><img src="file:///c:/Users/felipe.fadel/skolen-management/Marketing/Assets/gerado-ia/app_turma_esvaziando_contexto_v3.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt=""></div>
    <div class="text-side">
      <p class="label">Na pratica</p>
      <h2 class="headline">Veja a turma<br><em>antes de esvaziar.</em></h2>
      <p class="body-text">O gestor identifica queda de<br>engajamento aluno por aluno.</p>
    </div>
  </div>
</div>
</body>
</html>
